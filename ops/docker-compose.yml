# FilsPay stack: Postgres, apps/api behind a TLS reverse proxy (Caddy),
# apps/settlement and apps/reporting, plus the one-off migrate/seed jobs.
# apps/web and apps/admin are not included: they call apps/api over HTTP.
#
# The hosted demo box (0.5 vCPU / 2 GB RAM / 2 GB disk) runs this same file.
# Limits below fit that box: api 512 MB, Postgres 768 MB, the two workers
# 256 MB each, Caddy 128 MB (1.9 GB in all).
#
# Compose does NOT pick up ops/.env.docker by itself (only a file named
# `.env`, and only for ${...} substitution), so api and settlement load it
# with `env_file:`. Without it NODE_ENV was unset and the hosted API ran in
# dev mode: OTP codes returned in login responses and logged, non-secure
# cookies, http webhooks.
#
# api and settlement refuse to start without SETTLEMENT_INTERNAL_TOKEN and
# WEBHOOK_SECRET_ENCRYPTION_KEY: export them in the shell (or a `.env` next to
# this file) before `docker compose up`. SITE_ADDRESS is the public host name
# Caddy gets a certificate for (default: localhost, with Caddy's local CA).
#
# Run from the repo root:
#   docker compose -f ops/docker-compose.yml up -d --build postgres
#   docker compose -f ops/docker-compose.yml run --rm migrate
#   docker compose -f ops/docker-compose.yml up -d --build proxy api settlement reporting

# The database password comes from the environment (ops/.env on the server),
# never from this public file: it used to be hard-coded here, so every
# deployment ran on a published password. Use URL-safe characters
# (e.g. `openssl rand -hex 24`). Postgres sets it when the volume is first
# created; changing it later needs ALTER USER as well.
x-database-url: &database-url postgres://filspay:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (see ops/README.md)}@postgres:5432/filspay?sslmode=disable

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: filspay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (see ops/README.md)}
      POSTGRES_DB: filspay
    # Memory settings sized for this container's 768 MB. The hosted box ran
    # with a 32 MB shared_buffers (docs/perf, July settlement summary note).
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
    mem_limit: 768m
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - filspay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filspay -d filspay"]
      interval: 2s
      timeout: 3s
      retries: 20

  # One-off: applies db/migrations/*.sql, then exits. Re-run any time; the
  # runner tracks what's already applied (schema_migrations) and skips it.
  migrate:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
      target: tools
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  # One-off: deterministic seed data. It TRUNCATEs fixture tables and refuses
  # NODE_ENV=production (CLAUDE.md); never run it against the hosted box.
  seed:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
      target: tools
    command: ["npm", "run", "seed"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  # TLS reverse proxy: the only service published on all interfaces.
  # Caddy plus the built merchant dashboard/checkout and admin console
  # (ops/Dockerfile.proxy). It used to serve only the API, so neither
  # frontend was hosted at all.
  proxy:
    build:
      context: ..
      dockerfile: ops/Dockerfile.proxy
      args:
        SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    # Caddy used 39 MB idle and 43 MB under 12 checkouts/s; 128 MB leaves
    # room for more concurrent TLS connections without an OOM kill.
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
      target: runtime
    command: ["node", "dist/api/index.js"]
    restart: unless-stopped
    # Published on loopback only, for debugging on the box; clients go
    # through the proxy.
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env.docker
    environment:
      SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN:?set SETTLEMENT_INTERNAL_TOKEN}
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:?set WEBHOOK_SECRET_ENCRYPTION_KEY (32 bytes, base64)}
      DATABASE_URL: *database-url
      SETTLEMENT_INTERNAL_URL: http://settlement:8091
      # The proxy is one hop: trust its X-Forwarded-For for per-IP limits.
      TRUST_PROXY: "1"
      # Payment-link URLs handed to merchants. Unset, they pointed at the dev
      # server (http://localhost:5173/pay/...), so no hosted link worked.
      CHECKOUT_BASE_URL: https://${SITE_ADDRESS:-localhost}
      # Authorize and capture hold a connection for the whole acquirer call,
      # so the pool size sets checkout capacity (ops/loadtest/README.md).
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      # Per-request logging at info costs real CPU on 0.5 vCPU.
      LOG_LEVEL: warn
      # Collect garbage well before the 512 MB container limit kills Node.
      NODE_OPTIONS: --max-old-space-size=384
    cpus: 0.5
    mem_limit: 512m
    volumes:
      - kyc_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  settlement:
    build:
      context: ..
      dockerfile: ops/Dockerfile.go
    command: ["./settlement", "daemon"]
    restart: unless-stopped
    # On a redeploy, SIGTERM lets an in-flight batch transaction commit or roll
    # back; Docker's default 10 s could cut a long batch close short.
    stop_grace_period: 120s
    env_file: .env.docker
    environment:
      SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN:?set SETTLEMENT_INTERNAL_TOKEN}
      DATABASE_URL: *database-url
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy

  reporting:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
      target: runtime
    # No subcommand = `worker`.
    command: ["node", "dist/reporting/index.js"]
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      NODE_OPTIONS: --max-old-space-size=192
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  filspay_pgdata:
  kyc_data:
  caddy_data:
  caddy_config:
